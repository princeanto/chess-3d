<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Four statements a round, three of them true and one invented. Three wrong answers and you start over.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fffcf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%95%B5%EF%B8%8F</text></svg>">
<title>Spot the Lie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/*
 * Loud but tidy: warm paper, ink outlines, hard offset shadows so everything
 * sits on the page like a sticker, and one electric blue for anything you can
 * press. Green and red are still reserved — they only ever appear at the
 * reveal, because on this page they mean the answer.
 */
:root {
  --bg: #fffcf4;
  --surface: #ffffff;
  --raise: #f4efe2;
  --ink: #141310;
  --ink-2: #4c4940;
  --ink-3: #7d7969;
  --line: #141310;
  --accent: #2b4bff;
  --on-accent: #ffffff;
  --true: #0f9d5c;
  --true-wash: #e4f7ed;
  --fake: #ff4d3d;
  --fake-wash: #ffe9e6;
  --hard: 4px 4px 0 var(--line);
  --hard-sm: 3px 3px 0 var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131316;
    --surface: #1d1d21;
    --raise: #27272d;
    --ink: #f7f4eb;
    --ink-2: #c4c0b5;
    --ink-3: #8d8980;
    --line: #f7f4eb;
    --accent: #8ea3ff;
    --on-accent: #131316;
    --true: #3ddc97;
    --true-wash: #123024;
    --fake: #ff7d6d;
    --fake-wash: #301a16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131316;
  --surface: #1d1d21;
  --raise: #27272d;
  --ink: #f7f4eb;
  --ink-2: #c4c0b5;
  --ink-3: #8d8980;
  --line: #f7f4eb;
  --accent: #8ea3ff;
  --on-accent: #131316;
  --true: #3ddc97;
  --true-wash: #123024;
  --fake: #ff7d6d;
  --fake-wash: #301a16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 Gabarito, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap {
  max-width: 540px;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 0 18px calc(28px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}
#view { width: 100%; margin-block: auto; }

.rail { position: fixed; inset: 0 0 auto; height: 4px; background: transparent; z-index: 10; }
.rail span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s cubic-bezier(0.2, 0.7, 0.3, 1); }

/* -------------------------------- header -------------------------------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(20px + env(safe-area-inset-top)) 0 16px; }
/* A display rule beats the browser's own [hidden], so say it here or the
   header sits above the title on the start and game-over screens. */
.top[hidden] { display: none; }
.mark { margin: 0; font-family: Unbounded, Gabarito, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
.state { display: flex; align-items: center; gap: 14px; }
.pips { display: flex; gap: 7px; }
/* A spent life goes hollow, not red: red means the answer here. */
.pip { width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 50%; background: var(--ink); transition: background 0.25s ease, transform 0.25s ease; }
.pip.lost { background: transparent; transform: scale(0.78) rotate(8deg); }
.score { min-width: 2ch; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* --------------------------------- start -------------------------------- */
.title {
  margin: 0;
  font-family: Unbounded, Gabarito, sans-serif;
  font-weight: 700;
  font-size: clamp(34px, 10.5vw, 52px);
  line-height: 1.02;
  letter-spacing: -0.045em;
  text-wrap: balance;
}
.title em { font-style: normal; color: var(--accent); }
.lede { margin: 18px 0 0; font-size: 17px; line-height: 1.5; color: var(--ink-2); max-width: 34ch; }
.lede b { font-weight: 700; color: var(--ink); }
.go, .next {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  font-family: Unbounded, Gabarito, sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--on-accent);
  background: var(--accent);
  border: 2px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--hard);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.go:active, .next:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.record { display: flex; gap: 12px; margin: 24px 0 0; }
.record div { flex: 1; padding: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: var(--hard-sm); }
.record dt { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.record dd { margin: 4px 0 0; font-family: Unbounded, Gabarito, sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.how { margin: 22px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink-3); }
.credit { margin: 16px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }

/* --------------------------------- round -------------------------------- */
.plate {
  height: 128px;
  margin-bottom: 16px;
  background: var(--raise) center / cover no-repeat;
  border: 2px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--hard);
  filter: grayscale(1) contrast(1.05);
  transition: filter 0.65s ease;
}
.plate.lit { filter: none; }
.theme {
  display: inline-block;
  margin-bottom: 12px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--raise);
  border: 2px solid var(--line);
  border-radius: 999px;
  transform: rotate(-1.2deg);
}
.ask { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: var(--ink-2); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  width: 100%;
  padding: 16px;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--hard);
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease, opacity 0.2s ease;
  animation: deal 0.36s cubic-bezier(0.2, 0.8, 0.3, 1.1) both;
}
/* Set down by hand rather than printed. */
.card:nth-child(odd) { transform: rotate(-0.4deg); }
.card:nth-child(even) { transform: rotate(0.45deg); }
.card:nth-child(1) { animation-delay: 0.02s; }
.card:nth-child(2) { animation-delay: 0.08s; }
.card:nth-child(3) { animation-delay: 0.14s; }
.card:nth-child(4) { animation-delay: 0.2s; }
.card:active:not(:disabled) { transform: translate(3px, 3px) rotate(0deg); box-shadow: 1px 1px 0 var(--line); }
.key {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  font-family: Unbounded, Gabarito, sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  background: var(--raise);
  border: 2px solid var(--line);
  border-radius: 9px;
}
.claim { font-size: 17.5px; font-weight: 500; line-height: 1.35; letter-spacing: -0.012em; color: var(--ink); }
.verdict {
  flex: none;
  align-self: center;
  font-family: Unbounded, Gabarito, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  opacity: 0;
}
/* Colour, at last. */
.card.is-true { background: var(--true-wash); }
.card.is-true .verdict { color: var(--true); opacity: 1; }
.card.is-fake { background: var(--fake-wash); }
.card.is-fake .verdict { color: var(--fake); opacity: 1; }
.card.picked .key { color: var(--on-accent); background: var(--accent); }
.card.wrong { animation: shake 0.44s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
.card.gone { opacity: 0.4; }
.card:disabled { cursor: default; }
.mine { display: block; margin-top: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }

/* -------------------------------- reveal -------------------------------- */
.outcome { margin-top: 22px; animation: lift 0.3s ease both; }
.headline {
  margin: 0;
  font-family: Unbounded, Gabarito, sans-serif;
  font-size: clamp(19px, 5.4vw, 23px);
  font-weight: 700;
  line-height: 1.22;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.headline.good { color: var(--true); }
.headline.bad { color: var(--fake); }
.gain { display: inline-block; margin-left: 8px; font-family: Gabarito, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.why {
  margin: 14px 0 0;
  padding: 16px;
  font-size: 15.5px;
  line-height: 1.55;
  color: var(--ink-2);
  background: var(--raise);
  border: 2px solid var(--line);
  border-radius: 16px;
}
.why b { font-weight: 700; color: var(--ink); }
.hint {
  display: block;
  margin: 18px auto 0;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 999px;
  box-shadow: var(--hard-sm);
}
.hint:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }
.hint:disabled { color: var(--ink-3); box-shadow: none; opacity: 0.6; cursor: default; }

/* --------------------------------- done --------------------------------- */
.done { text-align: center; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0 0; }
.grades div { padding: 16px 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: var(--hard-sm); }
.grades dt { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.grades dd { margin: 6px 0 0; font-family: Unbounded, Gabarito, sans-serif; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.blank { padding: 48px 24px; text-align: center; }
.empty { padding: 30px 18px; text-align: center; color: var(--ink-3); margin: 0; }

@keyframes deal { from { opacity: 0; transform: translateY(16px) rotate(0deg); } to { opacity: 1; } }
@keyframes lift { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); }
  20%, 80% { transform: translateX(5px); }
  30%, 50%, 70% { transform: translateX(-8px); }
  40%, 60% { transform: translateX(8px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="rail"><span id="rail"></span></div>
<div class="wrap">
  <header class="top" id="top" hidden>
    <h1 class="mark">Spot the Lie</h1>
    <div class="state">
      <div class="pips" id="pips" role="img"></div>
      <div class="score" id="t-score">0</div>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
(function () {
  'use strict';

  /*
   * Three of the four statements in every round are true. They are picked to be
   * as hard to believe as the invented one — a round of ordinary facts and one
   * whopper would be no game at all.
   */
  var ROUNDS = [
    { t: "Animals", s: [
      "Octopuses have three hearts and blue blood",
      "A shrimp's heart is in its head",
      "Wombats produce cube-shaped droppings",
      "Jellyfish have a single large eye at the centre of the bell"],
      fake: 3, why: "Box jellyfish have twenty-four eyes in four clusters — and no brain to assemble what they see into one picture." },
    { t: "Animals", s: [
      "Sloths can hold their breath longer than dolphins can",
      "Elephants cannot jump",
      "Koala fingerprints are almost indistinguishable from human ones",
      "A giraffe's tongue is blue because it has no blood vessels"],
      fake: 3, why: "The tongue really is dark blue-purple, but from melanin, which stops it burning in the sun while it feeds. It has plenty of blood vessels." },
    { t: "Animals", s: [
      "Tardigrades have survived being exposed to the vacuum of space",
      "A mantis shrimp punches so fast the water around its claw briefly boils",
      "Horseshoe crabs have blue blood, used to test medicines for contamination",
      "Lobsters scream when they are dropped into boiling water"],
      fake: 3, why: "Lobsters have no vocal cords. The noise is steam forcing its way out of the shell." },
    { t: "Animals", s: [
      "Crows recognise individual human faces and hold grudges for years",
      "Honeybees can be trained to tell one human face from another",
      "Butterflies taste with their feet",
      "Ants never sleep"],
      fake: 3, why: "Fire ant workers take around 250 naps a day, roughly a minute each." },
    { t: "Animals", s: [
      "Sea otters hold hands while sleeping so they do not drift apart",
      "Flamingos hatch grey and turn pink from what they eat",
      "A group of flamingos is called a flamboyance",
      "Female seahorses give birth after the male carries the eggs"],
      fake: 3, why: "The female puts the eggs into the male's pouch, and it is the male that gives birth." },
    { t: "Animals", s: [
      "Axolotls can regrow limbs, jaws and parts of their brain",
      "Platypuses glow blue-green under ultraviolet light",
      "Platypuses sweat milk instead of feeding through nipples",
      "Bats are blind and navigate entirely by echolocation"],
      fake: 3, why: "Every bat species can see, and many see well in low light. Echolocation is an addition, not a replacement." },
    { t: "Animals", s: [
      "Sharks were swimming the oceans before the first trees grew",
      "A narwhal's tusk is really an overgrown tooth",
      "A snail can have thousands of teeth on its tongue",
      "A goldfish has a memory of about three seconds"],
      fake: 3, why: "Goldfish remember things for months and can be trained to push levers for food." },
    { t: "Animals", s: [
      "Cows have best friends and get stressed when separated from them",
      "Goats have rectangular pupils",
      "Chickens can tell apart more than a hundred different faces",
      "Pigs physically cannot look up at the sky"],
      fake: 3, why: "Pigs can look up. Their neck muscles make it awkward, not impossible." },
    { t: "Animals", s: [
      "Hummingbirds are the only birds that can fly backwards",
      "A hummingbird's heart can beat more than 1,200 times a minute",
      "The smallest hummingbird weighs less than a penny",
      "A hummingbird must eat every ten minutes or it dies within the hour"],
      fake: 3, why: "They get through the night by dropping into torpor, slowing heart and body temperature almost to a stop." },
    { t: "Animals", s: [
      "Dolphins have names for each other, in the form of signature whistles",
      "The orca is the largest member of the dolphin family",
      "The closest living land relative of the whale is the hippopotamus",
      "A blue whale's arteries are wide enough for a person to swim through"],
      fake: 3, why: "A blue whale's aorta is about the width of a dinner plate. Enormous, but nobody is swimming down it." },
    { t: "Animals", s: [
      "Cats cannot taste sweetness",
      "A cat's nose print is as individual as a human fingerprint",
      "Cats sleep for around two thirds of their lives",
      "Cats purr only when they are content"],
      fake: 3, why: "Cats also purr when injured, frightened or giving birth. The vibration may help them heal." },
    { t: "Animals", s: [
      "Reindeer eyes turn from gold in summer to blue in winter",
      "Polar bears have black skin under their white fur",
      "Arctic ground squirrels let their body temperature drop below freezing",
      "Polar bear meat is poisonous but the liver is safe to eat"],
      fake: 3, why: "It is the other way round. Polar bear liver holds enough vitamin A to make a person seriously ill." },

    { t: "Space", s: [
      "A day on Venus lasts longer than a year on Venus",
      "Venus is hotter than Mercury even though it is further from the Sun",
      "Venus spins the opposite way to almost every other planet",
      "Venus is the only planet named after a male god"],
      fake: 3, why: "Venus is the only planet named after a goddess. All the others carry male Roman names." },
    { t: "Space", s: [
      "There are more trees on Earth than stars in the Milky Way",
      "The Moon moves about 3.8 cm further away from us every year",
      "Helium was found on the Sun before anyone found it on Earth",
      "The Great Wall of China is the only human structure visible from the Moon"],
      fake: 3, why: "Nothing built by people can be seen from the Moon. The wall is hard to pick out even from low orbit." },
    { t: "Space", s: [
      "Saturn is light enough to float, given a big enough bath",
      "About a million Earths would fit inside the Sun",
      "A teaspoon of neutron star would weigh roughly a billion tonnes",
      "Jupiter is so large it has a small star burning at its core"],
      fake: 3, why: "Jupiter would need to be around eighty times heavier before it could ignite as a star." },
    { t: "Space", s: [
      "Astronauts grow up to five centimetres taller in orbit",
      "Astronauts describe space as smelling of seared steak and welding fumes",
      "There is no sound in space because there is nothing for it to travel through",
      "A person exposed to space would freeze solid within seconds"],
      fake: 3, why: "You would lose consciousness in about fifteen seconds from lack of oxygen. A vacuum carries heat away slowly." },
    { t: "Space", s: [
      "Olympus Mons on Mars is roughly three times the height of Everest",
      "Mars has seasons, and its ice caps grow and shrink with them",
      "Sunsets on Mars are blue",
      "A day on Mars is exactly as long as a day on Earth"],
      fake: 3, why: "A Martian day runs about thirty-nine minutes longer, which is why mission teams on Earth slowly slip out of step with it." },
    { t: "Space", s: [
      "Sunlight takes about eight minutes to reach us",
      "The Sun accounts for more than 99% of the mass of the solar system",
      "The Sun is white; our atmosphere is what makes it look yellow",
      "The Sun is the largest star in our galaxy"],
      fake: 3, why: "The Sun is an ordinary star. Some, such as UY Scuti, are more than a thousand times wider." },
    { t: "Space", s: [
      "Footprints left on the Moon could survive for millions of years",
      "The Moon has moonquakes",
      "There is water ice on the Moon, in craters the Sun never reaches",
      "The Moon always shows us the same face because it does not rotate"],
      fake: 3, why: "It rotates exactly once per orbit. That is precisely why the same side always faces us." },
    { t: "Space", s: [
      "Voyager 1 carries a gold-plated record of sounds and music from Earth",
      "Voyager 1 is the most distant human-made object from Earth",
      "The Voyager probes run on less power than an electric kettle",
      "Voyager 1 has now left the Milky Way"],
      fake: 3, why: "It left the Sun's bubble of particles in 2012. Leaving the galaxy would take hundreds of millions of years." },
    { t: "Space", s: [
      "Mercury has ice at its poles despite being nearest the Sun",
      "A year on Mercury is about 88 Earth days",
      "Mercury is shrinking as its core cools",
      "Mercury is the hottest planet in the solar system"],
      fake: 3, why: "Venus is hotter. Its thick atmosphere traps heat; Mercury has almost none and freezes at night." },

    { t: "History", s: [
      "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid",
      "Woolly mammoths were still alive when the Great Pyramid was built",
      "Oxford was teaching students before the Aztec Empire existed",
      "Egyptian records show the pyramids were built by slaves"],
      fake: 3, why: "The workers' village turned up bakeries, medical care and tombs of honour. They were paid labourers." },
    { t: "History", s: [
      "The shortest war on record lasted about 38 minutes",
      "The fax machine was invented before the telephone",
      "Harvard University is older than calculus",
      "The Hundred Years' War lasted exactly one hundred years"],
      fake: 3, why: "It ran 116 years, from 1337 to 1453, with long stretches of peace in the middle." },
    { t: "History", s: [
      "Napoleon was an ordinary height for a Frenchman of his day",
      "France's last execution by guillotine happened the year Star Wars came out",
      "Nintendo was founded in 1889, making playing cards",
      "Vikings wore horned helmets into battle"],
      fake: 3, why: "Not one horned helmet has ever been found in a Viking grave. The look was invented for a 19th-century opera." },
    { t: "History", s: [
      "Ketchup was sold as medicine in the 1830s",
      "7-Up once contained lithium",
      "Dr Pepper is older than Coca-Cola",
      "Coca-Cola was originally green"],
      fake: 3, why: "It has always been caramel brown. The green belonged to the bottles." },
    { t: "History", s: [
      "The Eiffel Tower can stand 15 cm taller in summer than in winter",
      "The Eiffel Tower was meant to be temporary and was nearly pulled down",
      "There is a small private apartment at the top of the Eiffel Tower",
      "The Eiffel Tower is repainted every single year"],
      fake: 3, why: "It is repainted roughly every seven years, by hand, using about sixty tonnes of paint." },
    { t: "History", s: [
      "Roman concrete can heal its own cracks, which is why it outlasts ours",
      "Roman gladiators ate a largely vegetarian diet",
      "Romans used urine as mouthwash",
      "Julius Caesar was the first Roman emperor"],
      fake: 3, why: "Caesar was never emperor. His adopted heir Augustus was the first, after Caesar was killed." },
    { t: "History", s: [
      "The first item sold on eBay was a broken laser pointer",
      "The first webcam was set up to watch a coffee pot",
      "The computing term bug caught on after a moth was found inside a machine",
      "The first email was sent between two computers on different continents"],
      fake: 3, why: "Ray Tomlinson sent it between two machines sitting next to each other in the same room." },
    { t: "History", s: [
      "Nokia began as a paper mill",
      "Samsung started out selling dried fish and groceries",
      "Wi-Fi is not short for anything",
      "Bluetooth is named after its inventor, Dr Harald Bluetooth"],
      fake: 3, why: "It is named after Harald Bluetooth Gormsson, a 10th-century Danish king who united warring tribes." },
    { t: "History", s: [
      "Scotland's national animal is the unicorn",
      "The Netherlands has more bicycles than people",
      "Australia fought a war against emus and lost",
      "Switzerland is so neutral it has no army"],
      fake: 3, why: "Switzerland has compulsory military service and one of the more heavily armed populations in Europe." },
    { t: "History", s: [
      "Tug of war used to be an Olympic sport",
      "An Olympic gold medal is mostly silver",
      "Painting and sculpture once won Olympic medals",

      card.querySelector(".verdict").textContent = isFake ? "Invented" : "True";
      if (i === index) {
        card.classList.add("picked");
        if (!right) card.classList.add("wrong");
        var mine = document.createElement("span");
        mine.className = "mine";
        mine.textContent = "Your pick, sadly";
        card.querySelector(".claim").appendChild(mine);
      }
    });

    var hint = document.querySelector('[data-act="hint"]');
    if (hint) hint.remove();
    var plate = document.getElementById("plate");
    if (plate) plate.classList.add("lit");

    var outcome = document.createElement("div");
    outcome.className = "outcome";
    outcome.innerHTML =
      '<p class="headline ' + (right ? "good" : "bad") + '">' + esc(line) +
        (right ? '<span class="gain">+' + gained + (game.streak > 2 ? " · streak " + game.streak : "") + "</span>" : "") +
      '</p>' +
      '<p class="why"><b>' + esc(round.s[round.fake]) + "</b> — " + esc(round.why) + "</p>" +
      '<button class="next" data-act="next">' +
        (game.strikes >= 3 ? "Survey the wreckage"
          : game.at + 1 >= ROUNDS.length ? "Show me the damage" : "Go again") +
      "</button>";
    document.getElementById("cards").after(outcome);
    outcome.querySelector(".next").focus({ preventScroll: true });

    paintTally();
    persist();
  }

  function next() {
    if (game.strikes >= 3) { renderOver(); return; }
    game.at += 1;
    persist();
    if (game.at >= ROUNDS.length) renderDone();
    else renderRound();
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function renderOver() {
    top.hidden = true;
    rail.style.width = "0%";
    // Nothing left to resume: the next run starts at round one.
    game.order = null;
    game.at = 0;
    persist();
    var accuracy = game.played ? Math.round((game.correct / game.played) * 100) : 0;
    view.innerHTML =
      '<section class="done">' +
        '<h2 class="title">Three strikes.</h2>' +
        '<p class="lede" style="margin-left:auto;margin-right:auto">You lasted ' +
          game.played + (game.played === 1 ? " round" : " rounds") +
          ' and got ' + accuracy + '% of them right. Back to round one with you.</p>' +
        '<dl class="grades">' +
          "<div><dt>Score</dt><dd>" + game.score + "</dd></div>" +
          "<div><dt>Right</dt><dd>" + game.correct + "/" + game.played + "</dd></div>" +
          "<div><dt>Best streak</dt><dd>" + game.best + "</dd></div>" +
        "</dl>" +
        '<button class="go" data-act="again">Back to round one</button>' +
      "</section>";
  }

  /* ---------------------------------- done -------------------------------- */

  function renderDone() {
    top.hidden = true;
    rail.style.width = "100%";
    var accuracy = game.played ? Math.round((game.correct / game.played) * 100) : 0;
    var verdict = accuracy >= 85 ? "Unfoolable. Frankly suspicious."
      : accuracy >= 65 ? "A good nose for nonsense."
      : accuracy >= 45 ? "Fooled roughly half the time, like everyone."
      : "I had your number the whole way.";
    view.innerHTML =
      '<section class="done">' +
        '<h2 class="title">' + esc(verdict) + "</h2>" +
        '<dl class="grades">' +
          "<div><dt>Score</dt><dd>" + game.score + "</dd></div>" +
          "<div><dt>Right</dt><dd>" + game.correct + "/" + game.played + "</dd></div>" +
          "<div><dt>Best streak</dt><dd>" + game.best + "</dd></div>" +
        "</dl>" +
        '<button class="go" data-act="again">Go round again</button>' +
        '<p class="how">The same ' + ROUNDS.length + " rounds come back in a new order, with the four statements shuffled inside each one.</p>" +
      "</section>";
  }

  /* -------------------------------- plumbing ------------------------------- */

  function startRun(fresh) {
    if (fresh || !game.order) {
      game.order = shuffle(ROUNDS.map(function (_, i) { return i; }));
      game.at = 0;
      game.score = 0;
      game.streak = 0;
      game.correct = 0;
      game.played = 0;
      game.hints = 3;
      game.strikes = 0;
    }
    persist();
    renderRound();
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act], [data-pick]");
    if (!el) return;
    if (el.dataset.pick !== undefined) return answer(Number(el.dataset.pick));
    var act = el.dataset.act;
    if (act === "play") startRun(false);
    else if (act === "again") startRun(true);
    else if (act === "next") next();
    else if (act === "hint") useHint();
  });

  document.addEventListener("keydown", function (e) {
    if (game.phase === "play" && e.key >= "1" && e.key <= "4") {
      var card = document.querySelector('[data-pick="' + (Number(e.key) - 1) + '"]');
      if (card && !card.disabled) answer(Number(e.key) - 1);
    } else if (game.phase === "reveal" && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      next();
    } else if (game.phase === "play" && e.key.toLowerCase() === "h") {
      useHint();
    }
  });

  renderStart();
})();
</script>
</body>
</html>
