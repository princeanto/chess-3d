<title>Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Mukta:wght@400;500;600&family=Rozha+One&display=swap">
<style>
/*
 * A bahi-khata: the red cloth-bound account book, tied with yellow thread.
 * Pale ledger paper with blue feint ruling and a red double margin; amounts
 * written rupees | paise with the red rule between; Dr and Cr, a T-account for
 * the month and the accountant's double rule under the balance.
 */
:root {
  --ground: #e9ede4;
  --leaf: #f7f9f3;
  --feint: #d2dde6;
  --margin: #d8938d;
  --ink: #1b2230;
  --ink-2: #485263;
  --ink-3: #6b7585;
  --lal: #a3191c;
  --on-lal: #f8eadf;
  --thread: #e0b64e;
  --slip: #fbf1d3;
  --slip-edge: #ecd9a0;
  --cr: #1b7a49;
  --warn: #9a5f06;
  --stamp: #b3261e;
  --link: #a3191c;
  --lift: 0 1px 0 rgba(27, 34, 48, 0.05), 0 18px 40px -24px rgba(27, 34, 48, 0.35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0b0e13;
    --leaf: #141920;
    --feint: #242d3a;
    --margin: #7a3a36;
    --ink: #e6eae1;
    --ink-2: #b0b8c3;
    --ink-3: #8a93a1;
    --lal: #8f1619;
    --thread: #b8923e;
    --slip: #2a2517;
    --slip-edge: #463c20;
    --cr: #55c28c;
    --warn: #e0a54c;
    --stamp: #f26d61;
    --link: #f08a7f;
    --lift: 0 0 0 1px #1c232d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0b0e13;
  --leaf: #141920;
  --feint: #242d3a;
  --margin: #7a3a36;
  --ink: #e6eae1;
  --ink-2: #b0b8c3;
  --ink-3: #8a93a1;
  --lal: #8f1619;
  --thread: #b8923e;
  --slip: #2a2517;
  --slip-edge: #463c20;
  --cr: #55c28c;
  --warn: #e0a54c;
  --stamp: #f26d61;
  --link: #f08a7f;
  --lift: 0 0 0 1px #1c232d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/1.5 Mukta, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

.book {
  max-width: 520px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--leaf);
  box-shadow: var(--lift);
  display: flex;
  flex-direction: column;
}

/* ---------------- the cover ---------------- */
.cover {
  position: relative;
  padding: calc(18px + env(safe-area-inset-top)) 20px 16px;
  background-color: var(--lal);
  /* A cloth weave, faint enough to read as texture rather than pattern. */
  background-image:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.07) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 4px);
  color: var(--on-lal);
}
.cover::after {
  /* The yellow thread a bahi-khata is tied with. */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  background: var(--thread);
}
.mark {
  font-family: "Rozha One", Georgia, "Times New Roman", serif;
  font-size: 34px;
  line-height: 1;
  letter-spacing: 0.005em;
  margin: 0;
  font-weight: 400;
}
.mark .dev { font-size: 21px; opacity: 0.72; margin-left: 10px; }
.status { margin-top: 8px; font-size: 13px; opacity: 0.86; }

.slip {
  margin: 0;
  padding: 10px 16px;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink-2);
  background: var(--slip);
  border-bottom: 1px solid var(--slip-edge);
}
.slip b { color: var(--ink); font-weight: 600; }

main { flex: 1; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
main > * { animation: fade 0.16s ease both; }

/* ---------------- shared type ---------------- */
.eyebrow, .sec-h, .folio, .facts dt {
  font: 600 11.5px/1.2 Mukta, system-ui, sans-serif;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.sec { padding: 22px 16px 4px; }
.sec-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1.5px solid var(--ink);
}
.sec-h .amt { font-size: 14px; letter-spacing: 0; text-transform: none; }
.small { font-size: 12.5px; color: var(--ink-3); margin: 10px 0 0; }

/* ---------------- money ---------------- */
.amt {
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  font-family: "Courier Prime", "Courier New", ui-monospace, monospace;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.amt.cr { color: var(--cr); }
/* Rupees and paise in their own columns, the red rule between them. */
.amt .p {
  font-size: 0.72em;
  margin-left: 3px;
  padding-left: 3px;
  border-left: 1px solid var(--margin);
  opacity: 0.78;
}
.amt.big { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
.drcr {
  font: 700 10px/1 "Courier Prime", "Courier New", monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.drcr.cr { color: var(--cr); }

/* ---------------- the month, as a T-account ---------------- */
.month {
  font-family: "Rozha One", Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: 34px;
  line-height: 1.05;
  margin: 4px 0 0;
  text-wrap: balance;
}
.t { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-top: 16px; }
.col { min-width: 0; }
.col.dr { padding-right: 12px; }
.col.cr { padding-left: 12px; border-left: 1.5px solid var(--ink); }
.hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 4px;
  border-bottom: 1.5px solid var(--ink);
  font: 700 15px/1.2 "Courier Prime", "Courier New", monospace;
}
.col.dr .hd { margin-right: -12px; padding-right: 12px; }
.col.cr .hd { margin-left: -12px; padding-left: 12px; }
.hint { font: 500 12px Mukta, system-ui, sans-serif; color: var(--ink-3); }
.tot { padding: 10px 0 6px; }
.t .amt.big { font-size: 22px; }
.line {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 3px 0;
  font-size: 13px;
  color: var(--ink-2);
  border-bottom: 1px solid var(--feint);
}
.line span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .n { font-family: "Courier Prime", "Courier New", monospace; color: var(--ink); }
.line.none { color: var(--ink-3); font-style: italic; border: 0; }
.bal {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-top: 10px;
  padding: 8px 0 6px;
  border-top: 1.5px solid var(--ink);
  /* The accountant's double rule under a closing figure. */
  border-bottom: 3px double var(--ink);
  font-weight: 600;
}
.bal small { font-weight: 400; font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.pace { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); max-width: 62ch; text-wrap: pretty; }
.pace b { font-family: "Courier Prime", "Courier New", monospace; font-weight: 700; color: var(--ink); }
.up { color: var(--stamp); }
.down { color: var(--cr); }
.unsure { color: var(--warn); }
.figure { margin-top: 6px; }

/* ---------------- items: things that need a decision ---------------- */
.item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  width: 100%;
  padding: 12px 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--feint);
  text-align: left;
}
button.item { cursor: pointer; }
button.item:hover .nm { text-decoration: underline; text-decoration-color: var(--margin); text-underline-offset: 3px; }
.nm { font-weight: 500; font-size: 15px; line-height: 1.3; }
.sub { display: block; margin-top: 2px; font-size: 13px; line-height: 1.4; color: var(--ink-3); }
.val { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; padding-top: 1px; text-align: right; }
.per { font-size: 11.5px; color: var(--ink-3); }
.tbc { font-size: 12px; color: var(--ink-3); }
.stamp {
  display: inline-block;
  margin-right: 8px;
  padding: 1px 5px 0;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  font: 700 10.5px/1.35 "Courier Prime", "Courier New", monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--stamp);
  vertical-align: 2px;
  transform: rotate(-3deg);
  animation: thunk 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
}
.stamp.warn { color: var(--warn); }
.stamp.quiet { color: var(--ink-3); }
.cov { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 62ch; }
.cov b { font-weight: 600; color: var(--ink); }

/* ---------------- the day book ---------------- */
.find {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  align-items: center;
  padding: 12px 16px 10px;
  background: var(--leaf);
  border-bottom: 1px solid var(--feint);
}
.find input {
  flex: 1 1 220px;
  min-width: 0;
  padding: 8px 0;
  font: 400 16px Mukta, system-ui, sans-serif;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1.5px solid var(--ink);
  border-radius: 0;
  outline: none;
}
.find input::placeholder, .ask input::placeholder { color: var(--ink-3); }
.pill {
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 500;
  background: var(--ground);
  border: 1px solid var(--feint);
  border-radius: 999px;
  cursor: pointer;
}
.ruled { position: relative; }
.ruled::before {
  /* The red double margin down the whole page, not row by row. */
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 55px;
  border-left: 3px double var(--margin);
  pointer-events: none;
}
.folio {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 16px 6px 68px;
  border-bottom: 1.5px solid var(--ink);
}
.folio span:last-child { font-family: "Courier Prime", "Courier New", monospace; letter-spacing: 0; text-transform: none; }
.entry {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  column-gap: 20px;
  align-items: start;
  width: 100%;
  padding: 11px 16px 11px 4px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--feint);
  text-align: left;
  cursor: pointer;
}
.entry:hover { background: color-mix(in srgb, var(--feint) 28%, transparent); }
.entry .d {
  text-align: right;
  font: 400 11.5px/1.15 "Courier Prime", "Courier New", monospace;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-top: 2px;
}
.entry .d b { display: block; font-size: 18px; letter-spacing: 0; color: var(--ink); }
.entry .nm, .entry .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry.unsure .nm::after { content: " · unclear"; font-weight: 400; font-size: 12px; color: var(--warn); }
.empty { padding: 28px 16px 28px 68px; color: var(--ink-3); margin: 0; }
.blank { padding: 48px 24px; text-align: center; }
.blank .sub { max-width: 34ch; margin: 4px auto 0; }

/* ---------------- ask ---------------- */
.ask input {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 10px 0;
  font: 500 20px/1.3 Mukta, system-ui, sans-serif;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1.5px solid var(--ink);
  border-radius: 0;
  outline: none;
}
.tries { margin-top: 12px; }
.try {
  display: block;
  width: 100%;
  padding: 12px 0;
  font-size: 15px;
  color: var(--ink-2);
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--feint);
  cursor: pointer;
}
.try:hover { color: var(--ink); }
.reply { padding: 16px 0 12px; }
.reply .figure { font: 700 34px/1.1 "Courier Prime", "Courier New", monospace; letter-spacing: -0.01em; }
.reply.lost .figure { font: 600 18px/1.35 Mukta, system-ui, sans-serif; letter-spacing: 0; }
.again { margin: 14px 0 0; padding: 8px 0; font-weight: 600; font-size: 14px; color: var(--link); background: none; border: 0; cursor: pointer; }

/* ---------------- tabs: ribbon markers on the book's edge ---------------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; pointer-events: none; }
.tabs .in {
  width: 100%;
  max-width: 520px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--leaf);
  border-top: 1px solid var(--feint);
  pointer-events: auto;
}
.tabs button {
  position: relative;
  padding: 13px 0 15px;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--ink-3);
  background: none;
  border: 0;
  cursor: pointer;
}
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: -1px; left: 30%; right: 30%;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--lal);
}

/* ---------------- the detail sheet ---------------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(12, 15, 20, 0.46); animation: fade 0.18s ease both; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 21;
  max-width: 520px;
  max-height: 86vh;
  margin: 0 auto;
  overflow: auto;
  padding: 8px 20px calc(22px + env(safe-area-inset-bottom));
  background: var(--leaf);
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.18);
  animation: rise 0.24s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.grip { width: 40px; height: 4px; margin: 4px auto 14px; border-radius: 4px; background: var(--feint); }
.sh-amt { display: flex; align-items: baseline; gap: 10px; }
.sh-amt .amt.big { font-size: 34px; }
.sh-nm { margin: 6px 0 2px; font-family: "Rozha One", Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.15; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 18px; padding: 12px 0; border-top: 1px solid var(--feint); border-bottom: 1px solid var(--feint); }
.facts div { min-width: 0; }
.facts dd { margin: 3px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.mono { font-family: "Courier Prime", "Courier New", ui-monospace, monospace; }
.src { padding: 10px 0; border-bottom: 1px solid var(--feint); }
.src .nm { display: block; }
.src .sub { overflow-wrap: anywhere; }
.done { width: 100%; margin-top: 18px; padding: 13px; font-weight: 600; color: var(--leaf); background: var(--ink); border: 0; border-radius: 10px; cursor: pointer; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes thunk {
  from { transform: rotate(-3deg) scale(1.6); opacity: 0; }
  60% { opacity: 1; }
  to { transform: rotate(-3deg) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>

<div class="book">
  <header class="cover">
    <h1 class="mark">Khata<span class="dev" lang="hi">खाता</span></h1>
    <div class="status" id="status"></div>
  </header>
  <p class="slip" id="slip"></p>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-act="tab" data-tab="now">Now</button>
    <button data-act="tab" data-tab="ledger">Ledger</button>
    <button data-act="tab" data-tab="watch">Watch</button>
    <button data-act="tab" data-tab="ask">Ask</button>
  </div>
</nav>
<div id="sheet-root"></div>

<script>/*__ENGINE__*/</script>
<script>
(function () {
  'use strict';

  /*
   * The engine is the same code `npm test` checks, bundled as `Khata`.
   * Everything below is presentation.
   */
  var K = window.Khata;
  var SAMPLE = /*__SAMPLE__*/[];
  var SAMPLE_NOW = /*__SAMPLE_NOW__*/0;

  // Email-derived text is untrusted: every string that came out of a mail goes
  // through this before it touches innerHTML.
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* not remembered; fine */ } },
  };

  var TABS = ['now', 'ledger', 'watch', 'ask'];
  var saved = store.get('khata.tab');
  var state = {
    tab: TABS.indexOf(saved) >= 0 ? saved : 'now',
    now: SAMPLE_NOW,
    books: null,
    filter: null,
    query: '',
    question: '',
    answer: null,
  };

  /* ------------------------------ money ------------------------------ */

  function amount(paise, dir, big) {
    var text = K.formatPaise(Math.abs(paise));
    var dot = text.lastIndexOf('.');
    var sign = paise < 0 ? '−' : '';
    return '<span class="amt' + (dir === 'credit' ? ' cr' : '') + (big ? ' big' : '') + '">' +
      '<span class="r">' + sign + esc(text.slice(0, dot)) + '</span>' +
      '<span class="p">' + esc(text.slice(dot + 1)) + '</span></span>';
  }
  // Whole rupees for prose, where paise are noise.
  function inr(paise) { return esc(K.formatPaise(Math.round(paise / 100) * 100, { round: true })); }
  // Ledger lines drop the symbol; the column head already says what they are.
  function bare(paise) { return inr(paise).replace('₹', ''); }
  function tag(dir) { return '<span class="drcr' + (dir === 'credit' ? ' cr' : '') + '">' + (dir === 'credit' ? 'Cr' : 'Dr') + '</span>'; }
  function acct(a) { return a ? a.issuer + (a.tail ? ' ••' + a.tail : '') : 'Account unknown'; }
  /*
   * What to call a transaction when the mail named no counterparty. A bank
   * charge has no merchant by nature, and "Unnamed" reads like a parse that
   * failed rather than a fee the bank took.
   */
  function name(t) {
    if (t.merchant) return t.merchant;
    var bank = t.account ? t.account.issuer : 'Bank';
    if (t.category === 'Fees') return 'Charge by ' + bank;
    return bank + (t.direction === 'credit' ? ' credit' : ' debit');
  }
  function stamp(text, tone) { return '<span class="stamp' + (tone ? ' ' + tone : '') + '">' + esc(text) + '</span>'; }
  function daysTo(at) {
    var d = K.dayGap(state.now, at);
    return d <= 0 ? 'today' : d === 1 ? 'tomorrow' : 'in ' + d + 'd';
  }

  var METHOD = { upi: 'UPI', card: 'Card', netbanking: 'Net banking', ach: 'Auto-debit', atm: 'ATM', cash: 'Cash', unknown: 'Method unknown' };
  var KIND = {
    'bank-alert': 'bank alert', 'upi-receipt': 'UPI receipt', 'merchant-receipt': 'shop receipt',
    statement: 'statement', mandate: 'auto-debit notice', bill: 'bill', 'refund-promise': 'refund notice',
    'reversal-promise': 'reversal notice', failure: 'failure notice', unknown: 'email',
  };

  /* ---------------------------- building blocks ---------------------------- */

  function section(title, right, body) {
    return '<section class="sec"><div class="sec-h"><span>' + esc(title) + '</span>' +
      (right ? '<span>' + right + '</span>' : '') + '</div>' + body + '</section>';
  }

  function item(stampHtml, title, sub, right, attrs) {
    var tagName = attrs ? 'button' : 'div';
    return '<' + tagName + ' class="item"' + (attrs ? ' ' + attrs : '') + '>' +
      '<div>' + stampHtml + '<span class="nm">' + esc(title) + '</span><span class="sub">' + esc(sub) + '</span></div>' +
      '<div class="val">' + (right || '') + '</div></' + tagName + '>';
  }

  function line(label, paise) {
    return '<div class="line"><span>' + esc(label) + '</span><span class="n">' + bare(paise) + '</span></div>';
  }

  function entry(t, showDate) {
    var parts = K.formatDay(t.at).split(' ');
    var unsure = t.confidence < K.REVIEW_BELOW;
    var extra = t.sources.length > 1 ? ' · ' + t.sources.length + ' alerts, counted once' : '';
    return '<button class="entry' + (unsure ? ' unsure' : '') + '" data-act="open" data-id="' + esc(t.id) + '">' +
      '<span class="d">' + (showDate ? '<b>' + esc(parts[0]) + '</b>' + esc(parts[1]) : '') + '</span>' +
      '<span><span class="nm">' + esc(name(t)) + '</span>' +
      '<span class="sub">' + esc(t.category + ' · ' + acct(t.account) + ' · ' + K.formatTime(t.at) + extra) + '</span></span>' +
      '<span class="val">' + amount(t.amountPaise, t.direction) + tag(t.direction) + '</span></button>';
  }

  function blank(title, detail) {
    return '<div class="blank"><div class="nm">' + esc(title) + '</div><span class="sub">' + esc(detail) + '</span></div>';
  }

  function groupSum(list, key) {
    var sums = new Map();
    list.forEach(function (t) { var k = key(t) || 'Other'; sums.set(k, (sums.get(k) || 0) + t.amountPaise); });
    return Array.from(sums, function (e) { return { key: e[0], sum: e[1] }; }).sort(function (a, b) { return b.sum - a.sum; });
  }

  /* --------------------------------- now --------------------------------- */

  function viewNow() {
    var b = state.books;
    if (!b.txns.length) return blank('Nothing read yet', 'No bank alerts were found in the period read.');

    // This month, unless it is empty — then the latest month that is not, labelled as such.
    var current = K.istMonthKey(state.now);
    var all = K.months(b.txns);
    var isCurrent = K.summariseMonth(b.txns, current).count > 0 || all.length === 0;
    var month = isCurrent ? current : all[0];
    var s = K.summariseMonth(b.txns, month);
    var pace = K.pace(b.txns, state.now);
    var cov = K.coverage(b.txns, month);
    var credits = groupSum(b.txns.filter(function (t) {
      return K.istMonthKey(t.at) === month && t.direction === 'credit' && t.confidence >= K.REVIEW_BELOW;
    }), function (t) { return t.category; });

    var change = pace.lastMonthPaise > 0
      ? Math.round(((pace.projectedPaise - pace.lastMonthPaise) / pace.lastMonthPaise) * 100)
      : null;

    var paceText = isCurrent
      ? inr(pace.perDayPaise) + ' a day for ' + pace.daysElapsed + ' days — on course for <b>' + inr(pace.projectedPaise) + '</b>' +
        (change !== null ? ', <span class="' + (change > 0 ? 'up' : 'down') + '">' + (change > 0 ? '+' : '') + change + '% on last month</span>' : '') + '.'
      : 'Nothing has come in for ' + esc(K.formatMonth(current)) + ' yet.';
    if (s.unsure) {
      paceText += ' <span class="unsure">' + s.unsure + ' unclear ' + (s.unsure === 1 ? 'alert is' : 'alerts are') + ' left out of these figures.</span>';
    }

    var missed = b.obligations.filter(function (o) { return o.status === 'missed'; });
    var pending = b.obligations.filter(function (o) { return o.status === 'pending'; });
    var lost = b.leaks.filter(function (l) { return l.kind !== 'zombie'; }).slice(0, 4);

    var attention = missed.map(function (o) {
      return item(stamp('Overdue'), o.label,
        o.kind === 'mandate' ? 'Auto-debit due ' + K.formatDay(o.dueAt) + ' never went through' : 'Due ' + K.formatDay(o.dueAt) + ' — no payment found',
        o.amountPaise ? amount(o.amountPaise) : '');
    }).concat(b.skipped.map(function (x) {
      return item(stamp('Skipped', 'warn'), x.merchant,
        'Usually charges ' + x.cadence + '; nothing around ' + K.formatDay(x.expectedAt), amount(x.amountPaise));
    })).join('');

    return '' +
      '<section class="sec">' +
        '<div class="eyebrow">' + (isCurrent ? 'The month so far' : 'Latest month with entries') + '</div>' +
        '<h2 class="month">' + esc(K.formatMonth(month)) + '</h2>' +
        '<div class="t">' +
          '<div class="col dr"><div class="hd"><span>Dr</span><span class="hint">went out</span></div>' +
            '<div class="tot">' + amount(s.outPaise, 'debit', true) + '</div>' +
            '<div>' + (s.byCategory.slice(0, 6).map(function (c) { return line(c.category, c.amountPaise); }).join('') || '<div class="line none">Nothing out yet</div>') + '</div></div>' +
          '<div class="col cr"><div class="hd"><span>Cr</span><span class="hint">came in</span></div>' +
            '<div class="tot">' + amount(s.inPaise, 'credit', true) + '</div>' +
            '<div>' + (credits.slice(0, 6).map(function (c) { return line(c.key, c.sum); }).join('') || '<div class="line none">Nothing in yet</div>') + '</div></div>' +
          '<div class="bal"><span>Balance c/d<small>what’s left over</small></span>' + amount(s.netPaise, s.netPaise >= 0 ? 'credit' : 'debit') + '</div>' +
        '</div>' +
        '<p class="pace">' + paceText + '</p>' +
      '</section>' +
      (attention ? section('Needs attention', '', attention) : '') +
      (pending.length ? section('Coming up', '', pending.slice(0, 4).map(function (o) {
        return item(stamp('Due ' + daysTo(o.dueAt), 'quiet'), o.label, K.formatDay(o.dueAt),
          o.amountPaise ? amount(o.amountPaise) : '<span class="tbc">amount to follow</span>');
      }).join('')) : '') +
      (lost.length ? section('Money you may have lost', amount(b.recoverablePaise), lost.map(function (l) {
        return item('', l.title, l.detail, l.amountPaise ? amount(l.amountPaise) : '',
          l.txnIds.length ? 'data-act="leak" data-id="' + esc(l.id) + '"' : '');
      }).join('')) : '') +
      section('How complete this is', '',
        '<p class="cov">' + (cov.accounts.length
          ? 'In ' + esc(K.formatMonth(month)) + ', heard from <b>' + cov.accounts.map(esc).join(', ') + '</b> — ' + cov.txnCount + ' entries.'
          : 'No account could be identified this month.') +
        ' Khata only sees accounts that email you; a card whose alerts go to SMS won’t appear here.</p>');
  }

  /* ------------------------------- ledger -------------------------------- */

  function viewLedger() {
    return '' +
      '<div class="find">' +
        '<input id="q" type="search" value="' + esc(state.query) + '" placeholder="Find a shop, category or account" autocomplete="off" enterkeyhint="search" aria-label="Find in the ledger">' +
        (state.filter ? '<button class="pill" data-act="unfilter">' + esc(state.filter.title) + ' <span aria-hidden="true">×</span><span class="sr"> — show everything</span></button>' : '') +
      '</div>' +
      '<div id="rows" class="ruled">' + ledgerRows() + '</div>';
  }

  function ledgerRows() {
    var list = state.books.txns;
    var narrowed = Boolean(state.filter || state.query.trim());
    if (state.filter) {
      var ids = new Set(state.filter.ids);
      list = list.filter(function (t) { return ids.has(t.id); });
    }
    var q = state.query.trim().toLowerCase();
    if (q) {
      list = list.filter(function (t) {
        return [t.merchant, t.category, acct(t.account)].some(function (v) { return (v || '').toLowerCase().indexOf(q) >= 0; });
      });
    }
    if (!list.length) return '<p class="empty">Nothing matches “' + esc(state.query) + '”.</p>';

    var out = '', lastDay = '', lastMonth = '';
    list.forEach(function (t) {
      var month = K.istMonthKey(t.at);
      if (month !== lastMonth) {
        lastMonth = month;
        lastDay = '';
        // Month totals only when the list is whole; on a filtered page they would describe rows you cannot see.
        var totals = '';
        if (!narrowed) {
          var ms = K.summariseMonth(state.books.txns, month);
          totals = 'Dr ' + inr(ms.outPaise) + ' · Cr ' + inr(ms.inPaise);
        }
        out += '<div class="folio"><span>' + esc(K.formatMonth(month)) + '</span><span>' + totals + '</span></div>';
      }
      var day = K.istDayKey(t.at);
      out += entry(t, day !== lastDay);
      lastDay = day;
    });
    return out;
  }

  /* -------------------------------- watch -------------------------------- */

  var PER_YEAR = { weekly: 52, monthly: 12, quarterly: 4, yearly: 1 };

  function viewWatch() {
    var b = state.books;
    var live = b.recurring.filter(function (r) { return r.active; });
    var gone = b.recurring.filter(function (r) { return !r.active; });
    var due = b.obligations.filter(function (o) { return o.status === 'pending'; }).sort(function (a, z) { return a.dueAt - z.dueAt; });
    if (!b.recurring.length && !due.length) {
      return blank('Nothing repeating yet', 'A charge has to turn up three times before Khata calls it a pattern.');
    }
    var annual = live.reduce(function (sum, r) { return sum + r.amountPaise * PER_YEAR[r.cadence]; }, 0);

    return '' +
      (live.length ? '<section class="sec"><div class="eyebrow">Spoken for every year</div>' +
        '<div class="figure">' + amount(annual, 'debit', true) + '</div>' +
        '<p class="pace">' + live.length + ' repeating ' + (live.length === 1 ? 'charge' : 'charges') + ' — about <b>' + inr(annual / 12) + '</b> a month before you have bought anything.</p></section>' : '') +
      (due.length ? section('Due soon', '', due.map(function (o) {
        var soon = K.dayGap(state.now, o.dueAt) <= 3;
        return item(stamp('Due ' + daysTo(o.dueAt), soon ? 'warn' : 'quiet'), o.label,
          (o.kind === 'bill' ? 'Bill' : o.kind === 'emi' ? 'EMI' : 'Auto-debit') + ' · ' + K.formatDay(o.dueAt),
          o.amountPaise ? amount(o.amountPaise) : '');
      }).join('')) : '') +
      (live.length ? section('Repeating', '', live.map(function (r) {
        return item(r.missing.length ? stamp('Skipped ' + r.missing.length, 'warn') : '', r.merchant,
          r.cadence + ' · ' + r.occurrences.length + ' times · next about ' + K.formatDay(r.nextExpectedAt),
          amount(r.amountPaise) + '<span class="per">' + inr(r.amountPaise * PER_YEAR[r.cadence]) + ' a year</span>');
      }).join('')) : '') +
      (gone.length ? section('Stopped', '', gone.map(function (r) {
        return item('', r.merchant, 'Last charged ' + K.formatDay(r.occurrences[r.occurrences.length - 1]) + ' · was ' + r.cadence, amount(r.amountPaise));
      }).join('')) : '');
  }

  /* --------------------------------- ask --------------------------------- */

  function viewAsk() {
    return '<section class="sec ask">' +
      '<form id="askf"><label class="eyebrow" for="aq">Ask your ledger</label>' +
      '<input id="aq" value="' + esc(state.question) + '" placeholder="How much on food last month?" autocomplete="off" enterkeyhint="go"></form>' +
      '<div id="answer">' + answerHtml() + '</div></section>';
  }

  function answerHtml() {
    var a = state.answer;
    if (!a) {
      return '<div class="tries">' + K.EXAMPLES.map(function (e) {
        return '<button class="try" data-act="try" data-q="' + esc(e) + '">' + esc(e) + '</button>';
      }).join('') + '</div><p class="small">Worked out on this device from the ledger. Nothing is sent anywhere.</p>';
    }
    var rows = a.txns.slice(0, 20).map(function (t) { return entry(t, true); }).join('');
    return '<div class="reply' + (a.understood ? '' : ' lost') + '"><div class="figure">' + esc(a.headline) + '</div>' +
      (a.detail ? '<p class="pace">' + esc(a.detail) + '</p>' : '') + '</div>' +
      (rows ? '<div class="ruled">' + rows + '</div>' : '') +
      '<button class="again" data-act="reset">Ask something else</button>';
  }

  function runAsk(question) {
    state.question = question;
    state.answer = question.trim() ? K.ask(question, state.books.txns, state.now) : null;
    render();
  }

  /* -------------------------------- sheet -------------------------------- */

  var opener = null;

  function openSheet(id) {
    var t = state.books.txns.find(function (x) { return x.id === id; });
    if (!t) return;
    opener = document.activeElement;
    var root = document.getElementById('sheet-root');
    root.innerHTML = '<div class="scrim" data-act="close"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">' +
        '<div class="grip"></div>' +
        '<div class="sh-amt">' + amount(t.amountPaise, t.direction, true) + tag(t.direction) + '</div>' +
        '<h2 class="sh-nm" id="sh-t">' + esc(name(t)) + '</h2>' +
        '<span class="sub">' + esc(K.formatDayLong(t.at) + ', ' + K.formatTime(t.at) + ' · ' + acct(t.account) + ' · ' + METHOD[t.method]) + '</span>' +
        '<dl class="facts">' +
          '<div><dt>Category</dt><dd>' + esc(t.category) + '</dd></div>' +
          '<div><dt>Reference</dt><dd class="mono">' + esc(t.reference || '—') + '</dd></div>' +
          '<div><dt>Confidence</dt><dd>' + Math.round(t.confidence * 100) + '%' + (t.confidence < K.REVIEW_BELOW ? ', left out of totals' : '') + '</dd></div>' +
        '</dl>' +
        '<div class="sec-h"><span>Where this came from</span></div>' +
        t.sources.map(function (s) {
          return '<div class="src"><span class="nm">' + esc(s.subject || '(no subject)') + '</span><span class="sub">' + esc(s.from + ' · ' + (KIND[s.kind] || 'email')) + '</span></div>';
        }).join('') +
        '<p class="small">' + (t.sources.length > 1 ? t.sources.length + ' emails described this one payment, so it is counted once.' : 'One email reported this payment.') + '</p>' +
        '<button class="done" data-act="close">Done</button>' +
      '</div>';
    root.querySelector('.done').focus();
  }

  function closeSheet() {
    var root = document.getElementById('sheet-root');
    if (!root.innerHTML) return;
    root.innerHTML = '';
    if (opener && document.contains(opener)) opener.focus();
  }

  /* -------------------------------- render ------------------------------- */

  var VIEWS = { now: viewNow, ledger: viewLedger, watch: viewWatch, ask: viewAsk };

  function render() {
    document.getElementById('view').innerHTML = VIEWS[state.tab]();
    document.querySelectorAll('.tabs [data-tab]').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false');
    });
  }

  function go(tab) {
    state.tab = tab;
    store.set('khata.tab', tab);
    if (tab !== 'ledger') state.filter = null;
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'tab') go(el.dataset.tab);
    else if (act === 'open') openSheet(el.dataset.id);
    else if (act === 'close') closeSheet();
    else if (act === 'unfilter') { state.filter = null; render(); }
    else if (act === 'try') runAsk(el.dataset.q);
    else if (act === 'reset') { state.answer = null; state.question = ''; render(); document.getElementById('aq').focus(); }
    else if (act === 'leak') {
      var leak = state.books.leaks.find(function (l) { return l.id === el.dataset.id; });
      if (!leak) return;
      state.filter = { ids: leak.txnIds, title: leak.title };
      state.query = '';
      go('ledger');
      state.filter = { ids: leak.txnIds, title: leak.title };
      render();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'q') return;
    state.query = e.target.value;
    document.getElementById('rows').innerHTML = ledgerRows();
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'askf') return;
    e.preventDefault();
    runAsk(document.getElementById('aq').value);
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* --------------------------------- boot -------------------------------- */

  state.books = K.build(SAMPLE, { now: state.now });
  var accounts = new Set(state.books.txns.filter(function (t) { return t.account; }).map(function (t) { return acct(t.account); }));
  document.getElementById('status').textContent =
    'Sample ledger · ' + SAMPLE.length + ' bank emails read · ' + accounts.size + ' accounts';
  document.getElementById('slip').innerHTML =
    '<b>These are made-up entries</b>, dated as if today were ' + esc(K.formatDayLong(state.now)) +
    ', so you can see what Khata does. None of it is your money. Once Gmail is connected, this page reads your own bank alerts instead.';
  render();
})();
</script>
