<title>Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*
 * A money tool, designed around its one job: say at a glance what went out,
 * what came in, and what needs doing. Cool neutrals, one blue for anything you
 * can press, green for money in, red for money out that needs attention, and
 * big wide figures, because the figures are the point.
 */
:root {
  --bg: #f2f3f5;
  --surface: #ffffff;
  --raise: #f6f7f9;
  --line: #e3e6eb;
  --ink: #0f1216;
  --ink-2: #4a5160;
  --ink-3: #6b7382;
  --accent: #2747e0;
  --on-accent: #ffffff;
  --out: #c8321e;
  --in: #0b7a50;
  --warn: #a86400;
  --shade: 15, 18, 22;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e11;
    --surface: #15181d;
    --raise: #1c2026;
    --line: #272c34;
    --ink: #eef0f3;
    --ink-2: #b3bac5;
    --ink-3: #8c94a2;
    --accent: #8099ff;
    --on-accent: #0c0e11;
    --out: #ff7a66;
    --in: #46c98f;
    --warn: #f0b04a;
    --shade: 238, 240, 243;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e11;
  --surface: #15181d;
  --raise: #1c2026;
  --line: #272c34;
  --ink: #eef0f3;
  --ink-2: #b3bac5;
  --ink-3: #8c94a2;
  --accent: #8099ff;
  --on-accent: #0c0e11;
  --out: #ff7a66;
  --in: #46c98f;
  --warn: #f0b04a;
  --shade: 238, 240, 243;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variation-settings: "wdth" 100;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; font-variation-settings: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }

/* ---------------- header ---------------- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(16px + env(safe-area-inset-top)) 20px 4px;
}
.brand {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
  font-variation-settings: "wdth" 125;
  letter-spacing: -0.01em;
}
.status { font-size: 12.5px; color: var(--ink-3); text-align: right; line-height: 1.35; }
.linkbtn {
  padding: 0;
  margin-left: 4px;
  font-weight: 600;
  color: var(--accent);
  background: none;
  border: 0;
  cursor: pointer;
}
.linkbtn:disabled { color: var(--ink-3); cursor: default; }

/* ---------------- the note under the header ---------------- */
.note {
  margin: 12px 16px 0;
  padding: 12px 14px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.note[hidden] { display: none; }
.note b { color: var(--ink); font-weight: 600; }
.act {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
  color: var(--on-accent);
  background: var(--accent);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
.fine { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.bar { display: block; height: 4px; margin-top: 10px; overflow: hidden; border-radius: 4px; background: var(--raise); }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }

main > * { animation: fade 0.16s ease both; }

/* ---------------- the month ---------------- */
.hero { padding: 22px 20px 8px; }
.kicker { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.big {
  margin: 6px 0 0;
  font-weight: 680;
  font-variation-settings: "wdth" 116;
  font-size: clamp(44px, 13vw, 60px);
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.big .cur { font-size: 0.56em; font-weight: 600; margin-right: 3px; vertical-align: 0.42em; color: var(--ink-2); }
.big.mid { font-size: clamp(34px, 10vw, 44px); }
.under { margin-top: 4px; font-size: 13px; color: var(--ink-3); }
.pair { display: flex; gap: 28px; margin-top: 16px; }
.pair .lab { display: block; font-size: 12.5px; color: var(--ink-3); }
.pair .val {
  font-size: 20px;
  font-weight: 640;
  font-variation-settings: "wdth" 110;
  font-variant-numeric: tabular-nums;
}
.pos { color: var(--in); }
.neg { color: var(--out); }
.split { display: flex; height: 10px; margin-top: 18px; overflow: hidden; border-radius: 5px; background: var(--raise); gap: 2px; }
.split i { display: block; height: 100%; background: rgba(var(--shade), var(--o)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; background: rgba(var(--shade), var(--o)); }
.legend b { font-weight: 560; color: var(--ink); font-variant-numeric: tabular-nums; }
.pace { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 60ch; text-wrap: pretty; }
.pace b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------------- grouped lists ---------------- */
.group { padding: 18px 16px 0; }
.group h2 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin: 0 4px 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
}
.group h2 .meta { color: var(--ink); font-variant-numeric: tabular-nums; }
.list { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  text-align: left;
  background: none;
  border: 0;
}
.row + .row { border-top: 1px solid var(--line); }
button.row { cursor: pointer; }
button.row:hover { background: var(--raise); }
.row-main { flex: 1; min-width: 0; }
.row-title { display: block; font-size: 15px; font-weight: 520; line-height: 1.3; }
.row-sub { display: block; margin-top: 2px; font-size: 13px; line-height: 1.4; color: var(--ink-3); }
.clip .row-title, .clip .row-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-end { flex: none; text-align: right; }
.row-end small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  font-size: 14px;
  font-weight: 650;
  color: var(--ink-2);
  background: var(--raise);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.amt { font-weight: 560; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt .p { font-weight: 400; font-size: 0.86em; color: var(--ink-3); }
.amt.in { color: var(--in); }
.amt.in .p { color: inherit; opacity: 0.75; }
.chip {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 8px;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.6;
  color: var(--ink-2);
  background: var(--raise);
  border-radius: 999px;
  vertical-align: 1px;
}
.chip.out { color: var(--out); background: color-mix(in srgb, var(--out) 13%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.plain { padding: 0 4px; font-size: 13.5px; color: var(--ink-2); margin: 0; max-width: 62ch; }
.plain b { font-weight: 600; color: var(--ink); }
.quiet-btn { margin-top: 12px; padding: 8px 4px; font-size: 13.5px; font-weight: 600; color: var(--out); background: none; border: 0; cursor: pointer; }

/* ---------------- transactions ---------------- */
.find { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--bg); }
.find input, .ask input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: none;
}
.find input:focus, .ask input:focus { border-color: var(--accent); }
.find input::placeholder, .ask input::placeholder { color: var(--ink-3); }
.pill { padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.month-h { padding: 18px 20px 2px; font-size: 20px; font-weight: 700; font-variation-settings: "wdth" 112; }
.month-h small { display: block; font-size: 13px; font-weight: 400; font-variation-settings: "wdth" 100; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.day { display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.day span:last-child { font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.days .list { margin: 0 16px; }
.unsure-dot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--warn); vertical-align: 2px; }
.empty { padding: 32px 20px; text-align: center; color: var(--ink-3); margin: 0; }
.blank { padding: 56px 28px; text-align: center; }
.blank .row-sub { max-width: 34ch; margin: 6px auto 0; }

/* ---------------- ask ---------------- */
.ask { padding: 20px 16px 0; }
.ask label { display: block; margin: 0 4px 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.examples { margin-top: 14px; }
.ex {
  display: inline-block;
  margin: 0 8px 8px 0;
  padding: 8px 12px;
  font-size: 14px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
}
.ex:hover { color: var(--ink); border-color: var(--ink-3); }
.answer { padding: 18px 4px 6px; }
.answer.lost .big { font-size: 18px; font-weight: 600; font-variation-settings: "wdth" 100; letter-spacing: 0; line-height: 1.4; }
.again { margin: 10px 4px 0; padding: 8px 0; font-weight: 600; font-size: 14px; color: var(--accent); background: none; border: 0; cursor: pointer; }
.small { margin: 10px 4px 0; font-size: 12.5px; color: var(--ink-3); }

/* ---------------- tabs ---------------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); }
.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
.tabs button { position: relative; padding: 14px 0 16px; font-size: 13px; font-weight: 600; color: var(--ink-3); background: none; border: 0; cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: -1px; left: 32%; right: 32%;
  height: 2px;
  border-radius: 0 0 2px 2px;
  background: var(--accent);
}

/* ---------------- detail sheet ---------------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 12, 0.45); animation: fade 0.18s ease both; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 21;
  max-width: 560px;
  max-height: 86vh;
  margin: 0 auto;
  overflow: auto;
  padding: 8px 20px calc(22px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.16);
  animation: rise 0.24s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.grip { width: 40px; height: 4px; margin: 4px auto 16px; border-radius: 4px; background: var(--line); }
.sheet h2 { margin: 10px 0 2px; font-size: 20px; font-weight: 650; font-variation-settings: "wdth" 108; line-height: 1.2; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; margin: 18px 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--ink-3); }
.facts dd { margin: 2px 0 0; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
.src { padding: 10px 0; border-bottom: 1px solid var(--line); }
.src .row-title { font-size: 14px; }
.src .row-sub { overflow-wrap: anywhere; }
.done { width: 100%; margin-top: 18px; padding: 13px; font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 12px; cursor: pointer; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <h1 class="brand">Khata</h1>
    <div class="status" id="status"></div>
  </header>
  <p class="note" id="slip"></p>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-act="tab" data-tab="now">Overview</button>
    <button data-act="tab" data-tab="ledger">Transactions</button>
    <button data-act="tab" data-tab="watch">Bills</button>
    <button data-act="tab" data-tab="ask">Ask</button>
  </div>
</nav>
<div id="sheet-root"></div>

<script>/*__ENGINE__*/</script>
<script>
(function () {
  'use strict';

  /*
   * The engine is the same code `npm test` checks, bundled as `Khata`.
   * Everything below is presentation and the Gmail connection.
   */
  var K = window.Khata;
  var SAMPLE = /*__SAMPLE__*/[];
  var SAMPLE_NOW = /*__SAMPLE_NOW__*/0;

  // Email-derived text is untrusted: every string that came out of a mail goes
  // through this before it touches innerHTML.
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* not remembered; fine */ } },
  };

  var TABS = ['now', 'ledger', 'watch', 'ask'];
  var saved = store.get('khata.tab');
  var state = {
    tab: TABS.indexOf(saved) >= 0 ? saved : 'now',
    mode: 'sample',
    phase: 'idle',
    progress: {},
    problem: null,
    now: SAMPLE_NOW,
    books: null,
    filter: null,
    query: '',
    question: '',
    answer: null,
  };

  /* ------------------------------ formatting ------------------------------ */

  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function longMonth(key) {
    var parts = key.split('-');
    return MONTHS[Number(parts[1]) - 1] + ' ' + parts[0];
  }

  function dayLabel(at) {
    if (K.istDayKey(at) === K.istDayKey(state.now)) return 'Today';
    if (K.dayGap(at, state.now) === 1) return 'Yesterday';
    return WEEKDAYS[new Date(at + 19800000).getUTCDay()] + ' ' + K.formatDay(at);
  }

  // Paise always shown, always quieter, so columns of figures line up.
  function amount(paise, dir) {
    var text = K.formatPaise(Math.abs(paise));
    var dot = text.lastIndexOf('.');
    return '<span class="amt' + (dir === 'credit' ? ' in' : '') + '">' + (dir === 'credit' ? '+' : '') +
      esc(text.slice(0, dot)) + '<span class="p">' + esc(text.slice(dot)) + '</span></span>';
  }
  // Whole rupees, for prose and headline figures.
  function inr(paise) { return K.formatPaise(Math.round(paise / 100) * 100, { round: true }); }
  function bigFigure(paise, cls) {
    var text = inr(Math.abs(paise));
    var sign = paise < 0 ? '−' : '';
    return '<div class="big' + (cls ? ' ' + cls : '') + '"><span class="cur">' + sign + '₹</span>' + esc(text.replace('₹', '')) + '</div>';
  }
  function acct(a) { return a ? a.issuer + (a.tail ? ' ••' + a.tail : '') : 'Account unknown'; }
  function chip(text, tone) { return '<span class="chip' + (tone ? ' ' + tone : '') + '">' + esc(text) + '</span>'; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function daysTo(at) {
    var d = K.dayGap(state.now, at);
    return d <= 0 ? 'Due today' : d === 1 ? 'Due tomorrow' : 'Due in ' + d + ' days';
  }

  /*
   * What to call a transaction when the mail named no counterparty. A bank
   * charge has no merchant by nature, and "Unnamed" reads like a parse that
   * failed rather than a fee the bank took.
   */
  function name(t) {
    if (t.merchant) return t.merchant;
    var bank = t.account ? t.account.issuer : 'Bank';
    if (t.category === 'Fees') return 'Charge by ' + bank;
    return bank + (t.direction === 'credit' ? ' credit' : ' debit');
  }
  function initial(t) {
    var m = /[A-Za-z0-9]/.exec(name(t));
    return m ? m[0].toUpperCase() : '·';
  }

  var METHOD = { upi: 'UPI', card: 'Card', netbanking: 'Net banking', ach: 'Auto-debit', atm: 'ATM', cash: 'Cash', unknown: 'Method unknown' };
  var KIND = {
    'bank-alert': 'Bank alert', 'upi-receipt': 'UPI receipt', 'merchant-receipt': 'Shop receipt',
    statement: 'Statement', mandate: 'Auto-debit notice', bill: 'Bill', 'refund-promise': 'Refund notice',
    'reversal-promise': 'Reversal notice', failure: 'Failure notice', unknown: 'Email',
  };

  /* ---------------------------- building blocks ---------------------------- */

  function group(title, right, body) {
    return '<section class="group"><h2><span>' + esc(title) + '</span>' +
      (right ? '<span class="meta">' + right + '</span>' : '') + '</h2><div class="list">' + body + '</div></section>';
  }

  function row(opts) {
    var tag = opts.attrs ? 'button' : 'div';
    return '<' + tag + ' class="row' + (opts.clip ? ' clip' : '') + '"' + (opts.attrs ? ' ' + opts.attrs : '') + '>' +
      (opts.avatar ? '<span class="avatar" aria-hidden="true">' + esc(opts.avatar) + '</span>' : '') +
      '<span class="row-main"><span class="row-title">' + (opts.chip || '') + esc(opts.title) +
      (opts.dot ? '<span class="unsure-dot" title="Unclear — left out of totals"></span>' : '') + '</span>' +
      (opts.sub ? '<span class="row-sub">' + esc(opts.sub) + '</span>' : '') + '</span>' +
      (opts.end || opts.endSub ? '<span class="row-end">' + (opts.end || '') + (opts.endSub ? '<small>' + esc(opts.endSub) + '</small>' : '') + '</span>' : '') +
      '</' + tag + '>';
  }

  function txnRow(t) {
    var extra = t.sources.length > 1 ? ' · ' + t.sources.length + ' emails, counted once' : '';
    return row({
      attrs: 'data-act="open" data-id="' + esc(t.id) + '"',
      clip: true,
      avatar: initial(t),
      title: name(t),
      dot: t.confidence < K.REVIEW_BELOW,
      sub: t.category + ' · ' + acct(t.account) + ' · ' + K.formatTime(t.at) + extra,
      end: amount(t.amountPaise, t.direction),
    });
  }

  function blank(title, detail) {
    return '<div class="blank"><div class="row-title">' + esc(title) + '</div><div class="row-sub">' + esc(detail) + '</div></div>';
  }

  function groupSum(list, key) {
    var sums = new Map();
    list.forEach(function (t) { var k = key(t) || 'Other'; sums.set(k, (sums.get(k) || 0) + t.amountPaise); });
    return Array.from(sums, function (e) { return { key: e[0], sum: e[1] }; }).sort(function (a, b) { return b.sum - a.sum; });
  }

  var SHADES = [0.9, 0.62, 0.42, 0.28, 0.17, 0.1];

  /* ------------------------------- overview ------------------------------- */

  function viewNow() {
    var b = state.books;
    if (!b.txns.length) {
      return state.phase === 'searching' || state.phase === 'reading'
        ? blank('Reading your mail', 'Transactions appear here as each conversation is read.')
        : blank('Nothing read yet', 'No bank alerts were found in the period read.');
    }

    // This month, unless it is empty — then the latest month that is not, labelled as such.
    var current = K.istMonthKey(state.now);
    var all = K.months(b.txns);
    var isCurrent = K.summariseMonth(b.txns, current).count > 0 || all.length === 0;
    var month = isCurrent ? current : all[0];
    var s = K.summariseMonth(b.txns, month);
    var pace = K.pace(b.txns, state.now);
    var cov = K.coverage(b.txns, month);

    // The top five categories get their own share; everything past that is grouped.
    var cats = s.byCategory.slice(0, 5).map(function (c) { return { label: c.category, value: c.amountPaise }; });
    var rest = s.byCategory.slice(5).reduce(function (sum, c) { return sum + c.amountPaise; }, 0);
    if (rest > 0) cats.push({ label: 'Everything else', value: rest });
    var total = cats.reduce(function (sum, c) { return sum + c.value; }, 0) || 1;
    var split = cats.map(function (c, i) {
      return '<i style="width:' + ((c.value / total) * 100).toFixed(2) + '%;--o:' + SHADES[i] + '" title="' + esc(c.label) + '"></i>';
    }).join('');
    var legend = cats.map(function (c, i) {
      return '<li><i style="--o:' + SHADES[i] + '"></i>' + esc(c.label) + ' <b>' + esc(inr(c.value)) + '</b></li>';
    }).join('');

    var change = pace.lastMonthPaise > 0
      ? Math.round(((pace.projectedPaise - pace.lastMonthPaise) / pace.lastMonthPaise) * 100)
      : null;
    var paceText = isCurrent
      ? esc(inr(pace.perDayPaise)) + ' a day over ' + plural(pace.daysElapsed, 'day') + ' — on course for <b>' + esc(inr(pace.projectedPaise)) + '</b>' +
        (change !== null ? ', <span class="' + (change > 0 ? 'neg' : 'pos') + '">' + (change > 0 ? '+' : '') + change + '% on last month</span>' : '') + '.'
      : 'Nothing has come in for ' + esc(longMonth(current)) + ' yet.';
    if (s.unsure) {
      paceText += ' <span style="color:var(--warn)">' + plural(s.unsure, 'unclear alert') + ' left out of these figures.</span>';
    }

    var missed = b.obligations.filter(function (o) { return o.status === 'missed'; });
    var pending = b.obligations.filter(function (o) { return o.status === 'pending'; });
    var lost = b.leaks.filter(function (l) { return l.kind !== 'zombie'; }).slice(0, 4);

    var attention = missed.map(function (o) {
      return row({
        chip: chip('Overdue', 'out'),
        title: o.label,
        sub: o.kind === 'mandate' ? 'Auto-debit due ' + K.formatDay(o.dueAt) + ' never went through' : 'Due ' + K.formatDay(o.dueAt) + ' — no payment found',
        end: o.amountPaise ? amount(o.amountPaise) : '',
      });
    }).concat(b.skipped.map(function (x) {
      return row({
        chip: chip('Skipped', 'warn'),
        title: x.merchant,
        sub: 'Usually charges ' + x.cadence + '; nothing around ' + K.formatDay(x.expectedAt),
        end: amount(x.amountPaise),
      });
    })).join('');

    return '' +
      '<section class="hero">' +
        '<div class="kicker">' + esc(longMonth(month)) + (isCurrent ? ' · so far' : ' · latest month with activity') + '</div>' +
        bigFigure(s.outPaise) +
        '<div class="under">spent</div>' +
        '<div class="pair">' +
          '<div><span class="lab">Received</span><span class="val pos">+' + esc(inr(s.inPaise)) + '</span></div>' +
          '<div><span class="lab">Net</span><span class="val ' + (s.netPaise >= 0 ? 'pos' : 'neg') + '">' + esc(inr(s.netPaise)) + '</span></div>' +
        '</div>' +
        (cats.length ? '<div class="split" role="img" aria-label="Spending by category">' + split + '</div><ul class="legend">' + legend + '</ul>' : '') +
        '<p class="pace">' + paceText + '</p>' +
      '</section>' +
      (attention ? group('Needs attention', '', attention) : '') +
      (pending.length ? group('Coming up', '', pending.slice(0, 4).map(function (o) {
        return row({
          chip: chip(daysTo(o.dueAt)),
          title: o.label,
          sub: K.formatDayLong(o.dueAt),
          end: o.amountPaise ? amount(o.amountPaise) : '',
          endSub: o.amountPaise ? '' : 'amount to follow',
        });
      }).join('')) : '') +
      (lost.length ? group('Money you may have lost', esc(inr(b.recoverablePaise)), lost.map(function (l) {
        return row({
          title: l.title,
          sub: l.detail,
          end: l.amountPaise ? amount(l.amountPaise) : '',
          attrs: l.txnIds.length ? 'data-act="leak" data-id="' + esc(l.id) + '"' : '',
        });
      }).join('')) : '') +
      '<section class="group"><h2><span>How complete this is</span></h2>' +
        '<p class="plain">' + (cov.accounts.length
          ? 'In ' + esc(longMonth(month)) + ', heard from <b>' + cov.accounts.map(esc).join(', ') + '</b> — ' + plural(cov.txnCount, 'transaction') + '.'
          : 'No account could be identified this month.') +
        ' Khata only sees accounts that send email alerts; a card whose alerts go to SMS won’t appear here.</p>' +
        (state.mode === 'live' ? '<button class="quiet-btn" data-act="erase">Erase what this page has stored</button>' : '') +
      '</section>';
  }

  /* ----------------------------- transactions ----------------------------- */

  function viewLedger() {
    return '' +
      '<div class="find">' +
        '<input id="q" type="search" value="' + esc(state.query) + '" placeholder="Search merchants, categories, accounts" autocomplete="off" enterkeyhint="search" aria-label="Search transactions">' +
        (state.filter ? '<button class="pill" data-act="unfilter">' + esc(state.filter.title) + '  ×</button>' : '') +
      '</div>' +
      '<div id="rows" class="days">' + ledgerRows() + '</div>';
  }

  function ledgerRows() {
    var list = state.books.txns;
    var narrowed = Boolean(state.filter || state.query.trim());
    if (state.filter) {
      var ids = new Set(state.filter.ids);
      list = list.filter(function (t) { return ids.has(t.id); });
    }
    var q = state.query.trim().toLowerCase();
    if (q) {
      list = list.filter(function (t) {
        return [name(t), t.category, acct(t.account)].some(function (v) { return (v || '').toLowerCase().indexOf(q) >= 0; });
      });
    }
    if (!list.length) return '<p class="empty">No transactions match “' + esc(state.query) + '”.</p>';

    // Grouped by day, with a month heading whenever the month turns.
    var out = '';
    var lastMonth = '';
    var i = 0;
    while (i < list.length) {
      var day = K.istDayKey(list[i].at);
      var month = day.slice(0, 7);
      if (month !== lastMonth) {
        lastMonth = month;
        var totals = '';
        // Month totals only for the whole list; on a filtered one they would describe rows you cannot see.
        if (!narrowed) {
          var ms = K.summariseMonth(state.books.txns, month);
          totals = '<small>Spent ' + esc(inr(ms.outPaise)) + ' · Received ' + esc(inr(ms.inPaise)) + '</small>';
        }
        out += '<div class="month-h">' + esc(longMonth(month)) + totals + '</div>';
      }
      var rows = [];
      var spent = 0;
      var first = list[i];
      while (i < list.length && K.istDayKey(list[i].at) === day) {
        if (list[i].direction === 'debit') spent += list[i].amountPaise;
        rows.push(txnRow(list[i]));
        i += 1;
      }
      out += '<div class="day"><span>' + esc(dayLabel(first.at)) + '</span><span>' + (spent ? esc(inr(spent)) + ' spent' : '') + '</span></div>' +
        '<div class="list">' + rows.join('') + '</div>';
    }
    return out;
  }

  /* --------------------------------- bills -------------------------------- */

  var PER_YEAR = { weekly: 52, monthly: 12, quarterly: 4, yearly: 1 };

  function viewWatch() {
    var b = state.books;
    var live = b.recurring.filter(function (r) { return r.active; });
    var gone = b.recurring.filter(function (r) { return !r.active; });
    var due = b.obligations.filter(function (o) { return o.status === 'pending'; }).sort(function (a, z) { return a.dueAt - z.dueAt; });
    if (!b.recurring.length && !due.length) {
      return blank('Nothing repeating yet', 'A charge has to turn up three times before Khata treats it as a pattern.');
    }
    var annual = live.reduce(function (sum, r) { return sum + r.amountPaise * PER_YEAR[r.cadence]; }, 0);

    return '' +
      (live.length ? '<section class="hero"><div class="kicker">Committed every year</div>' + bigFigure(annual, 'mid') +
        '<p class="pace">' + plural(live.length, 'repeating charge') + ' — about <b>' + esc(inr(annual / 12)) + '</b> a month before you have bought anything.</p></section>' : '') +
      (due.length ? group('Due soon', '', due.map(function (o) {
        var soon = K.dayGap(state.now, o.dueAt) <= 3;
        return row({
          chip: chip(daysTo(o.dueAt), soon ? 'warn' : ''),
          title: o.label,
          sub: (o.kind === 'bill' ? 'Bill' : o.kind === 'emi' ? 'EMI' : 'Auto-debit') + ' · ' + K.formatDayLong(o.dueAt),
          end: o.amountPaise ? amount(o.amountPaise) : '',
        });
      }).join('')) : '') +
      (live.length ? group('Subscriptions and repeating charges', '', live.map(function (r) {
        return row({
          chip: r.missing.length ? chip('Skipped ' + r.missing.length, 'warn') : '',
          title: r.merchant,
          sub: r.cadence.charAt(0).toUpperCase() + r.cadence.slice(1) + ' · ' + plural(r.occurrences.length, 'charge') + ' · next around ' + K.formatDay(r.nextExpectedAt),
          end: amount(r.amountPaise),
          endSub: inr(r.amountPaise * PER_YEAR[r.cadence]) + ' a year',
        });
      }).join('')) : '') +
      (gone.length ? group('Stopped', '', gone.map(function (r) {
        return row({
          title: r.merchant,
          sub: 'Last charged ' + K.formatDay(r.occurrences[r.occurrences.length - 1]) + ' · was ' + r.cadence,
          end: amount(r.amountPaise),
        });
      }).join('')) : '');
  }

  /* ---------------------------------- ask --------------------------------- */

  function viewAsk() {
    return '<section class="ask">' +
      '<form id="askf"><label for="aq">Ask about your money</label>' +
      '<input id="aq" value="' + esc(state.question) + '" placeholder="How much on food last month?" autocomplete="off" enterkeyhint="go"></form>' +
      '<div id="answer">' + answerHtml() + '</div></section>';
  }

  function answerHtml() {
    var a = state.answer;
    if (!a) {
      return '<div class="examples">' + K.EXAMPLES.map(function (e) {
        return '<button class="ex" data-act="try" data-q="' + esc(e) + '">' + esc(e) + '</button>';
      }).join('') + '</div><p class="small">Worked out on this device from your transactions. Nothing is sent anywhere.</p>';
    }
    var rows = a.txns.slice(0, 20).map(txnRow).join('');
    return '<div class="answer' + (a.understood ? '' : ' lost') + '"><div class="big mid">' + esc(a.headline) + '</div>' +
      (a.detail ? '<p class="pace">' + esc(a.detail) + '</p>' : '') + '</div>' +
      (rows ? '<div class="list">' + rows + '</div>' : '') +
      '<button class="again" data-act="reset">Ask something else</button>';
  }

  function runAsk(question) {
    state.question = question;
    state.answer = question.trim() ? K.ask(question, state.books.txns, state.now) : null;
    render();
  }

  /* --------------------------------- sheet -------------------------------- */

  var opener = null;

  function openSheet(id) {
    var t = state.books.txns.find(function (x) { return x.id === id; });
    if (!t) return;
    opener = document.activeElement;
    document.getElementById('sheet-root').innerHTML = '<div class="scrim" data-act="close"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">' +
        '<div class="grip"></div>' +
        '<div class="big mid' + (t.direction === 'credit' ? ' pos' : '') + '">' + (t.direction === 'credit' ? '+' : '') + esc(K.formatPaise(t.amountPaise)) + '</div>' +
        '<h2 id="sh-t">' + esc(name(t)) + '</h2>' +
        '<span class="row-sub">' + esc((t.direction === 'credit' ? 'Received ' : 'Paid ') + K.formatDayLong(t.at) + ' at ' + K.formatTime(t.at) + ' · ' + METHOD[t.method]) + '</span>' +
        '<dl class="facts">' +
          '<div><dt>Category</dt><dd>' + esc(t.category) + '</dd></div>' +
          '<div><dt>Account</dt><dd>' + esc(acct(t.account)) + '</dd></div>' +
          '<div><dt>Reference</dt><dd class="mono">' + esc(t.reference || '—') + '</dd></div>' +
          '<div><dt>Confidence</dt><dd>' + Math.round(t.confidence * 100) + '%' + (t.confidence < K.REVIEW_BELOW ? ' — left out of totals' : '') + '</dd></div>' +
        '</dl>' +
        '<div class="kicker">Where this came from</div>' +
        t.sources.map(function (s) {
          return '<div class="src"><span class="row-title">' + esc(s.subject || '(no subject)') + '</span><span class="row-sub">' + esc(s.from + ' · ' + (KIND[s.kind] || 'Email')) + '</span></div>';
        }).join('') +
        '<p class="small" style="margin-left:0">' + (t.sources.length > 1 ? t.sources.length + ' emails described this one payment, so it is counted once.' : 'One email reported this payment.') + '</p>' +
        '<button class="done" data-act="close">Done</button>' +
      '</div>';
    document.querySelector('#sheet-root .done').focus();
  }

  function closeSheet() {
    var root = document.getElementById('sheet-root');
    if (!root.innerHTML) return;
    root.innerHTML = '';
    if (opener && document.contains(opener)) opener.focus();
  }

  /* -------------------------------- render -------------------------------- */

  var VIEWS = { now: viewNow, ledger: viewLedger, watch: viewWatch, ask: viewAsk };

  function render() {
    document.getElementById('view').innerHTML = VIEWS[state.tab]();
    document.querySelectorAll('.tabs [data-tab]').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false');
    });
  }

  function go(tab) {
    state.tab = tab;
    store.set('khata.tab', tab);
    if (tab !== 'ledger') state.filter = null;
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'tab') go(el.dataset.tab);
    else if (act === 'open') openSheet(el.dataset.id);
    else if (act === 'close') closeSheet();
    else if (act === 'unfilter') { state.filter = null; render(); }
    else if (act === 'connect' || act === 'sync' || act === 'retry') sync();
    else if (act === 'erase') erase();
    else if (act === 'try') runAsk(el.dataset.q);
    else if (act === 'reset') { state.answer = null; state.question = ''; render(); document.getElementById('aq').focus(); }
    else if (act === 'leak') {
      var leak = state.books.leaks.find(function (l) { return l.id === el.dataset.id; });
      if (!leak) return;
      state.query = '';
      state.tab = 'ledger';
      store.set('khata.tab', 'ledger');
      state.filter = { ids: leak.txnIds, title: leak.title };
      render();
      window.scrollTo(0, 0);
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'q') return;
    state.query = e.target.value;
    document.getElementById('rows').innerHTML = ledgerRows();
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'askf') return;
    e.preventDefault();
    runAsk(document.getElementById('aq').value);
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* ------------------------------- the cache ------------------------------ */

  /*
   * What each email meant, keyed by Gmail message id — never what it said.
   * Bodies are parsed the moment they arrive and dropped; this store holds
   * amounts, dates, senders and subject lines, in this browser only.
   */
  var vault = (function () {
    function open() {
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open('khata', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    }
    function run(mode, work) {
      try {
        return open().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction('kv', mode);
            var req = work(tx.objectStore('kv'));
            tx.oncomplete = function () { db.close(); resolve(req.result); };
            tx.onerror = tx.onabort = function () { db.close(); reject(tx.error); };
          });
        });
      } catch (e) {
        return Promise.reject(e);
      }
    }
    // Storage can be refused outright (private windows, blocked site data);
    // the page then works for the session and simply forgets on close.
    return {
      load: function () { return run('readonly', function (s) { return s.get('ledger'); }).catch(function () { return null; }); },
      save: function (v) { return run('readwrite', function (s) { return s.put(v, 'ledger'); }).catch(function () {}); },
      erase: function () { return run('readwrite', function (s) { return s.delete('ledger'); }).catch(function () {}); },
    };
  })();

  /* --------------------------------- Gmail -------------------------------- */

  /*
   * Two tools, both read-only, and nothing else is in this page's manifest —
   * it cannot send, forward, label, trash or delete anything, because it was
   * never granted the tools that do.
   */
  var SERVER = 'Gmail';
  var mcp = null;
  var ledger = { parsed: {}, lastSyncAt: 0 };
  var running = false;

  var DENIALS = ['needs_reauth', 'server_not_connected', 'selection_required', 'not_in_manifest',
    'blocked_by_policy', 'approval_required', 'not_granted', 'capability_disabled', 'capability_removed'];

  function payloadOf(result) {
    var p = result && result.payload;
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = null; } }
    return p && typeof p === 'object' ? p : {};
  }

  // One retry, only for failures the runtime stamps retryable, after a jittered wait.
  function read(tool, input) {
    var once = function () { return mcp.callTool(SERVER, tool, input).then(payloadOf); };
    return once().catch(function (err) {
      if (!err || !err.retryable) throw err;
      var wait = Math.min(err.retryAfterMs || 1500, 60000) + Math.random() * 900;
      return new Promise(function (r) { setTimeout(r, wait); }).then(once);
    });
  }

  function toMessage(m) {
    return {
      id: String(m.id),
      threadId: String(m.threadId || ''),
      from: m.sender || '',
      subject: m.subject || '',
      date: Number(m.internalDate) || Date.parse(m.date) || 0,
      body: m.plaintextBody || m.snippet || '',
    };
  }

  /*
   * Worth fetching in full: a conversation with a message Khata has not read
   * yet, from a known bank or payment app or with a rupee amount in its
   * snippet. The search is broad on purpose; this is where newsletters get
   * left behind without costing a request each.
   */
  var MONEYISH = /(?:₹|\bRs\.?|\bINR)\s?\d/i;
  function worthReading(thread) {
    return (thread.messages || []).some(function (m) {
      return !ledger.parsed[m.id] && (K.identifySender(m.sender || '') || MONEYISH.test(m.snippet || ''));
    });
  }

  function rebuild() {
    if (state.mode !== 'live') return;
    state.now = Date.now();
    state.books = K.buildFromParsed(Object.keys(ledger.parsed).map(function (k) { return ledger.parsed[k]; }), { now: state.now });
    // Never pull a field out from under someone typing in it.
    var active = document.activeElement;
    if (!(active && active.tagName === 'INPUT' && document.getElementById('view').contains(active))) render();
    paint();
  }

  function save(complete) {
    if (complete) ledger.lastSyncAt = Date.now();
    return vault.save({ v: K.PARSER_VERSION, parsed: ledger.parsed, lastSyncAt: ledger.lastSyncAt });
  }

  function sync() {
    if (!mcp || running) return;
    running = true;
    state.problem = null;
    if (state.mode !== 'live') {
      // Sample entries leave before a single real one arrives; the two never share a page.
      state.mode = 'live';
      rebuild();
    }
    state.phase = 'searching';
    state.progress = { found: 0, estimate: 0, read: 0, toRead: 0, skipped: 0 };
    paint();

    // A full year the first time; afterwards only the days since the last complete read.
    var days = ledger.lastSyncAt ? Math.max(3, Math.ceil((Date.now() - ledger.lastSyncAt) / 864e5) + 2) : 365;
    var query = K.gmailQuery(days);
    var threads = [];

    function page(token) {
      return read('search_threads', token ? { query: query, pageSize: 50, pageToken: token } : { query: query, pageSize: 50 })
        .then(function (res) {
          threads = threads.concat(res.threads || []);
          if (!state.progress.estimate && res.resultCountEstimate) state.progress.estimate = Number(res.resultCountEstimate) || 0;
          state.progress.found = threads.length;
          paint();
          if (res.nextPageToken && threads.length < 4000) return page(res.nextPageToken);
        });
    }

    page(null).then(function () {
      var queue = threads.filter(worthReading);
      state.phase = 'reading';
      state.progress.toRead = queue.length;
      paint();
      var next = 0;
      var sinceRender = 0;
      function worker() {
        if (next >= queue.length) return Promise.resolve();
        var thread = queue[next++];
        return read('get_thread', { threadId: thread.id, messageFormat: 'PLAIN_TEXT' })
          .then(function (res) {
            (res.messages || []).forEach(function (m) {
              var message = toMessage(m);
              // Parsed here, and the text goes no further than this line.
              ledger.parsed[message.id] = K.safeParse(message);
            });
          })
          .catch(function (err) {
            // A denial will fail every call, so it ends the read; anything else
            // costs one conversation, counted and reported.
            if (err && DENIALS.indexOf(err.code) >= 0) throw err;
            state.progress.skipped += 1;
          })
          .then(function () {
            state.progress.read += 1;
            sinceRender += 1;
            if (sinceRender >= 8) {
              sinceRender = 0;
              rebuild();
              if (state.progress.read % 40 === 0) save(false);
            } else {
              paint();
            }
            return worker();
          });
      }
      return Promise.all([worker(), worker(), worker(), worker()]);
    })
      .then(function () { return save(true); })
      .then(function () { state.phase = 'idle'; })
      .catch(function (err) {
        state.phase = 'error';
        state.problem = explain(err);
        var code = err && err.code;
        if (code === 'not_in_manifest' || code === 'server_not_connected' || code === 'blocked_by_policy') {
          // Access withdrawn: what was read under it goes too.
          ledger = { parsed: {}, lastSyncAt: 0 };
          vault.erase();
        } else if (DENIALS.indexOf(code) < 0) {
          save(false);
        }
      })
      .then(function () {
        running = false;
        rebuild();
        paint();
      });
  }

  function explain(err) {
    var code = err && err.code;
    var said = err && err.message ? ' (' + err.message + ')' : '';
    switch (code) {
      case 'needs_reauth':
        return { title: 'Gmail needs reconnecting', detail: 'Its sign-in has lapsed. Reconnect Gmail in claude.ai → Settings → Connectors, then sync again.', again: false, hide: true };
      case 'server_not_connected':
        return { title: 'Gmail isn’t connected', detail: 'Add Gmail in claude.ai → Settings → Connectors, then open this page again.', again: false, hide: true };
      case 'selection_required':
        return { title: 'Choose a Gmail account', detail: 'More than one Gmail is connected. Pick the one Khata should read when claude.ai asks, then sync again.', again: true, hide: true };
      case 'not_in_manifest':
        return { title: 'Gmail is off for this page', detail: 'Access was declined or switched off, so what was read has been cleared. Reload the page to be asked again.', again: false, hide: true };
      case 'blocked_by_policy':
      case 'approval_required':
        return { title: 'Blocked by your organisation', detail: 'A policy on your account stops this page reading Gmail.', again: false, hide: true };
      case 'not_granted':
      case 'capability_disabled':
      case 'capability_removed':
        return { title: 'This view can’t reach Gmail', detail: 'Open Khata inside claude.ai, where your connectors are available.', again: false, hide: true };
      case 'server_unavailable':
      case 'rate_limited':
        return { title: 'Gmail didn’t answer', detail: 'That is usually brief. Everything read so far is kept — try again in a minute.', again: true };
      case 'tool_error':
        return { title: 'Gmail turned a request down', detail: 'Everything read so far is kept.' + said, again: true };
      default:
        return { title: 'Reading stopped partway', detail: 'Everything read so far is kept.' + said, again: true };
    }
  }

  function erase() {
    vault.erase();
    ledger = { parsed: {}, lastSyncAt: 0 };
    state.mode = 'sample';
    state.phase = 'idle';
    state.problem = null;
    state.now = SAMPLE_NOW;
    state.books = K.build(SAMPLE, { now: SAMPLE_NOW });
    state.filter = null;
    go('now');
    paint();
  }

  /* -------------------------------- status -------------------------------- */

  function ago(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 90) return 'just now';
    var m = Math.round(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.round(m / 60);
    return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
  }

  function accountCount() {
    var seen = new Set();
    state.books.txns.forEach(function (t) { if (t.account) seen.add(acct(t.account)); });
    return seen.size;
  }

  var PRIVACY = 'Read-only: Khata can search and read your mail, never send, change or delete it. ' +
    'Mail reaches this page through Anthropic’s Gmail connector; your transactions are worked out and kept in this browser, and no email text is stored.';

  function paint() {
    var status = document.getElementById('status');
    var slip = document.getElementById('slip');
    var p = state.progress || {};
    var problem = state.problem;

    if (state.mode === 'sample') {
      status.textContent = 'Sample data';
      var intro = '<b>These are made-up transactions</b>, dated as if today were ' + esc(K.formatDayLong(SAMPLE_NOW)) +
        ', so you can see what Khata does. None of it is your money.';
      if (problem && problem.hide) {
        slip.innerHTML = '<b>' + esc(problem.title) + '.</b> ' + esc(problem.detail) +
          (problem.again ? '<br><button class="act" data-act="retry">Try again</button>' : '');
      } else if (mcp) {
        slip.innerHTML = intro + '<br><button class="act" data-act="connect">Read my Gmail</button>' +
          '<span class="fine">' + esc(PRIVACY) + '</span>';
      } else {
        slip.innerHTML = intro + ' Open this page in claude.ai with Gmail connected to read your own.';
      }
      slip.hidden = false;
      return;
    }

    var read = Object.keys(ledger.parsed).length;
    if (state.phase === 'searching') {
      status.textContent = 'Searching…';
      slip.innerHTML = 'Found <b>' + p.found + '</b> conversations' +
        (p.estimate > p.found ? ' of about ' + p.estimate : '') + ' that might mention money.' +
        '<span class="bar"><span style="width:6%"></span></span>';
      slip.hidden = false;
    } else if (state.phase === 'reading') {
      var pct = p.toRead ? Math.round((p.read / p.toRead) * 100) : 100;
      status.textContent = 'Reading…';
      slip.innerHTML = 'Read <b>' + p.read + '</b> of ' + p.toRead + ' conversations. Transactions appear as they’re read.' +
        '<span class="bar"><span style="width:' + pct + '%"></span></span>';
      slip.hidden = false;
    } else if (problem) {
      status.innerHTML = esc(plural(read, 'email') + ' read') + ' · <button class="linkbtn" data-act="sync">Sync</button>';
      slip.innerHTML = '<b>' + esc(problem.title) + '.</b> ' + esc(problem.detail) +
        (problem.again ? '<br><button class="act" data-act="retry">Try again</button>' : '');
      slip.hidden = false;
    } else {
      status.innerHTML = esc(plural(accountCount(), 'account') + ' · updated ' + (ledger.lastSyncAt ? ago(ledger.lastSyncAt) : 'partly')) +
        ' · <button class="linkbtn" data-act="sync"' + (running ? ' disabled' : '') + '>Sync</button>';
      slip.hidden = !(p.skipped > 0);
      if (p.skipped > 0) {
        slip.innerHTML = esc(plural(p.skipped, 'conversation') + ' could not be read this time and will be tried again on the next sync.');
      }
    }
  }

  /* --------------------------------- boot --------------------------------- */

  // First paint is the sample, always — nothing below is allowed to hold it up.
  state.books = K.build(SAMPLE, { now: state.now });
  render();
  paint();

  // Keep "updated 3m ago" honest without re-rendering anything else.
  setInterval(function () { if (state.mode === 'live' && state.phase === 'idle') paint(); }, 60000);

  var api = window.claude;
  if (!api || typeof api.use !== 'function') return;

  api.use('mcp').then(function (namespace) {
    if (!namespace) return;
    mcp = namespace;
    paint();

    return vault.load().then(function (stored) {
      // Readings from an older parser are thrown away; the mail is read again.
      if (stored && stored.v === K.PARSER_VERSION && stored.parsed && Object.keys(stored.parsed).length) {
        ledger = { parsed: stored.parsed, lastSyncAt: stored.lastSyncAt || 0 };
        state.mode = 'live';
        rebuild();
      }
      return api.use('permissions');
    }).then(function (permissions) {
      var ask = permissions
        ? permissions.state('mcp:' + SERVER).catch(function () { return 'unavailable'; })
        : Promise.resolve('unavailable');
      return ask.then(function (answer) {
        // Already allowed and already reading: refresh quietly. Otherwise wait
        // for the button, so the consent dialog follows a tap, not a page load.
        if (answer === 'granted' && state.mode === 'live') sync();
      });
    });
  }).catch(function () { /* the sample stays; nothing to report */ });
})();
</script>
